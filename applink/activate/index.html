<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-itunes-app" content="app-id=6445924092" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Kích hoạt CA2 RS</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f7fb;
      color: #0f172a;
    }
    main {
      max-width: 420px;
      margin: 48px auto;
      padding: 24px;
      background: #fff;
      border-radius: 12px;
    }
    a {
      display: block;
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
    }
    .primary { background: #1858ea; color: #fff; }
    .secondary { background: #e8eefc; color: #1858ea; }
    p { line-height: 1.5; }
    #device { color: #64748b; font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
  <main>
    <h1>CA2 RS</h1>
    <p id="status">Nếu chưa có ứng dụng, hãy cài từ App Store rồi bấm Mở ứng dụng.</p>
    <a id="open-app" class="primary" href="apprs://activate">Mở ứng dụng</a>
    <a id="install-ios" class="secondary" href="itms-apps://apps.apple.com/app/id6445924092">Cài từ App Store</a>
    <p id="device"></p>
  </main>
  <script>
    (function () {
      var search = window.location.search || "";
      var code = "";
      var match = /(?:\?|&)c=([^&]*)/.exec(search);
      if (match) {
        try {
          code = decodeURIComponent(match[1].replace(/\+/g, " "));
        } catch (error) {
          code = match[1];
        }
      }

      var ua = navigator.userAgent || "";
      var apple = /iPhone|iPad|iPod|Macintosh|Mac OS X|CriOS|FxiOS|EdgiOS/i.test(ua);
      var android = /Android/i.test(ua) && !apple;
      var play =
        "https://play.google.com/store/apps/details?id=com.rs.ca2&referrer=" +
        encodeURIComponent("c=" + code);
      var scheme = "apprs://activate?c=" + encodeURIComponent(code);
      var intent =
        "intent://activate?c=" +
        encodeURIComponent(code) +
        "#Intent;scheme=apprs;package=com.rs.ca2;S.browser_fallback_url=" +
        encodeURIComponent(play) +
        ";end";
      var openLink = document.getElementById("open-app");
      var iosLink = document.getElementById("install-ios");
      var status = document.getElementById("status");
      var device = document.getElementById("device");
      openLink.href = scheme;
      device.textContent = (android ? "Android" : "Apple") + " — " + ua;

      if (!android) return;

      iosLink.href = play;
      iosLink.textContent = "Cài từ CH Play";
      openLink.href = intent;
      status.textContent = "Đang mở ứng dụng...";
      window.location.replace(intent);
    })();
  </script>
</body>
</html>
